<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Fold6 Frame Monitor</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        * { box-sizing: border-box; }
        body { background: #070a12; color: #e2e8f0; font-family: system-ui, sans-serif; padding: 10px; margin: 0; font-size: 13px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 6px; margin-bottom: 10px; }
        h1 { margin: 0; font-size: 14px; color: #60a5fa; font-weight: 600; }
        #status-dot { width: 8px; height: 8px; background: #ef4444; border-radius: 50%; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .card { background: #0f172a; padding: 10px; border-radius: 6px; border: 1px solid #1e293b; }
        .full-width { grid-column: span 2; display: flex; justify-content: space-between; }
        .label { color: #94a3b8; font-size: 10px; text-transform: uppercase; font-weight: 500; }
        .value { font-size: 18px; font-weight: 700; margin-top: 2px; color: #ffffff; }
        .chart-container { background: #0f172a; padding: 8px; border-radius: 6px; border: 1px solid #1e293b; position: relative; height: 180px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>JOY-FLOW CORE v1.7</h1>
        <div id="status-dot"></div>
    </div>
    
    <div class="grid">
        <div class="card">
            <div class="label">Temperature</div>
            <div class="value" id="temp-val">0.0°C</div>
        </div>
        <div class="card">
            <div class="label">Net Speed</div>
            <div class="value" id="net-val">0.0M</div>
        </div>
        <div class="card full-width">
            <div>
                <div class="label">Ratio Gauge</div>
                <div class="value" id="ratio-val" style="font-size:15px;">0/0</div>
            </div>
            <div style="text-align: right;">
                <div class="label">Fold6 Battery</div>
                <div class="value" id="bat-val">0%</div>
            </div>
        </div>
    </div>

    <div class="chart-container">
        <canvas id="mobileChart"></canvas>
    </div>

    <script>
        const ctx = document.getElementById('mobileChart').getContext('2d');
        const mobileChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Temp',
                    data: [],
                    borderColor: '#60a5fa',
                    borderWidth: 2,
                    pointRadius: 0,
                    tension: 0.1,
                    fill: false
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { display: false },
                    y: { grid: { color: '#1e293b' }, ticks: { color: '#94a3b8', font: { size: 9 } } }
                },
                plugins: { legend: { display: false } }
            }
        });

        const ws = new WebSocket(`ws://${window.location.hostname || '127.0.0.1'}:8765`);
        ws.onopen = () => document.getElementById('status-dot').style.background = '#10b981';
        ws.onclose = () => document.getElementById('status-dot').style.background = '#ef4444';

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            
            // Render UI metrics dynamically using compact spacing limits
            document.getElementById('temp-val').innerText = data.calculated_temperature.toFixed(1) + "°C";
            document.getElementById('net-val').innerText = data.smoothed_network_mbps.toFixed(1) + "M";
            document.getElementById('ratio-val').innerText = data.normalized_load_ratio;
            document.getElementById('bat-val').innerText = data.battery_pct + "%" + (data.is_plugged ? "⚡" : "");

            // Update compact scrolling mobile line timeline chart window
            mobileChart.data.labels.push("");
            mobileChart.data.datasets[0].data.push(data.calculated_temperature);

            if (mobileChart.data.labels.length > 20) {
                mobileChart.data.labels.shift();
                mobileChart.data.datasets[0].data.shift();
            }
            mobileChart.update('none');
        };
    </script>
</body>
</html>
