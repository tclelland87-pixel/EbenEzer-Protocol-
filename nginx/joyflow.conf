# 1. Establish clear Connection mapping rules for long-lived sockets
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 2. HTTP Block - Auto-Forwards unsecured access to safe TLS 443 environments
server {
    listen 80;
    listen [::]:80;
    server_name localhost telemetry.local; # Swap with your phone IP or domain if required
    return 301 https://$host$request_uri;
}

# 3. HTTPS Block - Hardened Proxy Termination Layer
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name localhost telemetry.local;

    # SSL Cert Paths (Populate via local self-signed blocks or Let's Encrypt keys)
    ssl_certificate /etc/ssl/certs/joyflow.crt;
    ssl_certificate_key /etc/ssl/private/joyflow.key;

    # High-Security TLS Handshake Presets
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Anti-Exploit Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Route A: Serve Ultra-Lightweight Mobile Dashboard Assets Statically
    location / {
        root /var/www/joyflow;
        index dashboard.html;
        try_files $uri $uri/ =404;
    }

    # Route B: Proxy WebSockets Handshakes directly to the Active Daemon Core
    location /ws {
        proxy_pass http://127.0.0.1:8765;
        
        # Enforce HTTP/1.1 protocol rules required for WebSockets stream multiplexing
        proxy_http_version 1.1;
        
        # Pass raw protocol upgrade parameters downstream
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # Keep client network identity footprints intact
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keepalive timeouts. Prevents the proxy from dropping silent streams after 60s
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
